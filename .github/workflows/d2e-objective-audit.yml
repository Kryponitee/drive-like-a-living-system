name: DLS D2e read-only PPO objective alignment audit

on:
  push:
    paths:
      - .github/workflows/d2e-objective-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d2e-objective
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
    steps:
      - name: Confirm all original models, reports and validation data already exist
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          for variant in A B C; do
            for dir in d1-v1 d2b-v1 d2d-v1; do
              test -f "$DLS_DATA_ROOT/checkpoints/$dir/$variant-seed42.pt"
            done
            for dir in d2b d2d; do
              test -f "$DLS_DATA_ROOT/reports/$dir/train-$variant-seed42.json"
            done
          done
          test -f "$DLS_DATA_ROOT/reports/d2d/d2d-summary.json"
          test -f "$DLS_DATA_ROOT/demonstrations/d1-v1/val/worker-00-density-0.00.npz"
          mkdir -p "$TMPDIR" "$DLS_DATA_ROOT/reports/d2e"
          test ! -f "$DLS_DATA_ROOT/reports/d2e/d2e-objective-diagnostic.json"

      - name: Fetch exact revision of diagnostic, no dependencies installed
        shell: bash
        run: |
          set -euo pipefail
          for item in "src/dls_p0.py:dls_p0.py" "scripts/d2e_objective_diagnostic.py:d2e_objective.py"; do
            SRC="${item%%:*}"
            TARGET="${item#*:}"
            RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$SRC"
            OK=0
            for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
              if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/$TARGET"; then
                OK=1
                break
              fi
            done
            test "$OK" = 1
            "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/$TARGET"
            sha256sum "$TMPDIR/$TARGET"
          done

      - name: Analyze reward and goal mismatch on old results and validation imitation drift
        shell: bash
        run: |
          set -euo pipefail
          "$DLS_ENV/bin/python" "$TMPDIR/d2e_objective.py"
          test -s "$DLS_DATA_ROOT/reports/d2e/d2e-objective-diagnostic.json"
          {
            echo "## D2e read-only optimization audit"
            echo "- Paired original BC / initial-noise PPO / corrected-noise PPO"
            echo "- Reuses existing 4300..4311 evaluation reports and 9822-step BC validation dataset"
            echo "- No simulation, no new training or checkpoints, no extra downloads"
            echo "- Report: \`$DLS_DATA_ROOT/reports/d2e/d2e-objective-diagnostic.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
