name: DLS D0 expert data audit

on:
  push:
    paths:
      - .github/workflows/d0-expert-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expert-audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      PYTHONNOUSERSITE: "1"
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
      TMPDIR: /mnt/datasets/lxb/dls/tmp
    steps:
      - name: Verify data disk and DLS environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test -x /home/ps/miniconda3/envs/dls-p0/bin/python
          test -f "$DLS_DATA_ROOT/metadrive_assets/version.txt"

      - name: Evaluate expert and save small structured demonstration probe
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 90 "https://raw.githubusercontent.com/Kryponitee/drive-like-a-living-system/main/scripts/d0_expert_audit.py" -o "$TMPDIR/d0_expert_audit.py"
          /home/ps/miniconda3/envs/dls-p0/bin/python "$TMPDIR/d0_expert_audit.py"
          {
            echo "## DLS D0 expert audit"
            echo "- Report: \`$DLS_DATA_ROOT/reports/d0/expert_audit.json\`"
            echo "- Demonstrations: \`$DLS_DATA_ROOT/demonstrations/d0-expert-probe.npz\`"
            echo "- No large training data generated; no D1 training started."
          } >> "$GITHUB_STEP_SUMMARY"
