name: DLS D2i official SB3-Contrib recurrent PPO compatibility smoke

on:
  push:
    paths:
      - .github/workflows/d2i-sb3-official-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d2i-official-sb3
  cancel-in-progress: false

jobs:
  official_recurrentppo_smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      BASE_ENV: /home/ps/miniconda3/envs/dls-p0
      SB3_VENV: /home/ps/miniconda3/envs/dls-sb3-compat
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
      PIP_CACHE_DIR: /mnt/datasets/lxb/dls/cache/pip
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Verify isolated root-disk venv destination and existing core DLS environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test "$(findmnt -n -o TARGET -T "$BASE_ENV")" = "/"
          test -x "$BASE_ENV/bin/python"
          test -f "$DLS_DATA_ROOT/reports/d2h/d2h-summary.json"
          test -f "$DLS_DATA_ROOT/metadrive_assets/version.txt"
          test "$(df -Pk "$BASE_ENV" | awk 'NR==2 {print $4}')" -gt 2097152
          test "$(df -Pk "$DLS_DATA_ROOT" | awk 'NR==2 {print $4}')" -gt 10485760
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$DLS_DATA_ROOT/reports/d2i" "$DLS_DATA_ROOT/checkpoints/d2i" "$DLS_DATA_ROOT/tensorboard/d2i"
          echo "System disk: $(df -h "$BASE_ENV" | tail -1)"
          echo "Data disk: $(df -h "$DLS_DATA_ROOT" | tail -1)"
          "$BASE_ENV/bin/python" - <<'PY'
          import importlib.metadata as metadata
          for name in ("torch","gymnasium","numpy","metadrive-simulator"):
              print(name,metadata.version(name))
          import torch
          assert torch.__version__.startswith("2.5.1")
          assert torch.cuda.device_count() >= 3
          PY

      - name: Create light shared-package compatibility venv on ROOT disk, without modifying dls-p0
        shell: bash
        run: |
          set -euo pipefail
          if test -e "$SB3_VENV"; then
            test -f "$SB3_VENV/pyvenv.cfg"
            grep -Eq 'include-system-site-packages = true' "$SB3_VENV/pyvenv.cfg"
            test -x "$SB3_VENV/bin/python"
          else
            "$BASE_ENV/bin/python" -m venv --system-site-packages "$SB3_VENV"
          fi
          "$SB3_VENV/bin/python" - <<'PY'
          import sys
          import torch
          import metadrive
          print("SB3 venv interpreter:",sys.executable)
          print("Inherited torch:",torch.__version__)
          PY
          test "$(findmnt -n -o TARGET -T "$SB3_VENV")" = "/"

      - name: Verify version constraints in pip dry-run before any compatible package install
        shell: bash
        run: |
          set -euo pipefail
          "$BASE_ENV/bin/python" - <<'PY'
          import importlib.metadata as md
          from pathlib import Path
          names = ("torch", "numpy", "metadrive-simulator")
          lines = [f"{name}=={md.version(name)}" for name in names]
          file = Path("/mnt/datasets/lxb/dls/reports/d2i/inherited-constraints.txt")
          file.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
          "$SB3_VENV/bin/python" -m pip install --dry-run --report \
            "$DLS_DATA_ROOT/reports/d2i/official-pip-dry-run.json" \
            --disable-pip-version-check --no-input \
            -c "$DLS_DATA_ROOT/reports/d2i/inherited-constraints.txt" \
            'gymnasium==1.1.1' 'stable-baselines3==2.6.0' 'sb3-contrib==2.6.0'

      - name: Install only pinned official small RL packages in overlay venv
        shell: bash
        run: |
          set -euo pipefail
          "$SB3_VENV/bin/python" -m pip install \
            --disable-pip-version-check --no-input \
            -c "$DLS_DATA_ROOT/reports/d2i/inherited-constraints.txt" \
            'gymnasium==1.1.1' 'stable-baselines3==2.6.0' 'sb3-contrib==2.6.0'
          "$SB3_VENV/bin/python" -m pip check
          "$SB3_VENV/bin/python" - <<'PY'
          import torch, gymnasium, stable_baselines3, sb3_contrib
          from metadrive.envs.metadrive_env import MetaDriveEnv
          assert torch.__version__.startswith("2.5.1")
          assert gymnasium.__version__=="1.1.1"
          assert stable_baselines3.__version__=="2.6.0"
          assert sb3_contrib.__version__=="2.6.0"
          print("OFFICIAL PACKAGE COMPATIBILITY PASS: 2.6.0 on inherited torch",torch.__version__)
          PY
          "$BASE_ENV/bin/python" - <<'PY'
          import importlib.util, importlib.metadata as md, torch
          assert torch.__version__.startswith("2.5.1")
          assert md.version("gymnasium")=="1.4.0", "Core DLS gymnasium version changed unexpectedly"
          assert importlib.util.find_spec("sb3_contrib") is None, "Core DLS unexpectedly modified"
          print("Core DLS Conda environment UNCHANGED")
          PY
          "$SB3_VENV/bin/python" -m pip freeze > "$DLS_DATA_ROOT/reports/d2i/pip-freeze-overlay.txt"

      - name: Download single official-baseline script, verify Python syntax
        shell: bash
        run: |
          set -euo pipefail
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/d2i_sb3_recurrentppo_baseline.py"
          OK=0
          for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
            if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/d2i_official_sb3.py"; then
              OK=1
              break
            fi
          done
          test "$OK" = 1
          "$SB3_VENV/bin/python" -m py_compile "$TMPDIR/d2i_official_sb3.py"
          sha256sum "$TMPDIR/d2i_official_sb3.py"

      - name: Smoke test official RecurrentPPO on 4 independent MetaDrive subprocess envs for 16384 frames
        shell: bash
        run: |
          set -euo pipefail
          "$SB3_VENV/bin/python" "$TMPDIR/d2i_official_sb3.py"
          test -s "$DLS_DATA_ROOT/reports/d2i/official-rl-smoke.json"
          test -s "$DLS_DATA_ROOT/checkpoints/d2i/official-recurrentppo-16k.zip"
          test -s "$DLS_DATA_ROOT/checkpoints/d2i/official-recurrentppo-vecnormalize-16k.pkl"
          "$SB3_VENV/bin/python" - <<'PY'
          import json
          from pathlib import Path
          p=Path("/mnt/datasets/lxb/dls/reports/d2i/official-rl-smoke.json")
          r=json.loads(p.read_text())
          assert r["train_steps_across_all_environments"]==16384
          assert r["eval_seeds"]==list(range(5400,5412))
          assert len(r["evaluation_episodes"])==12
          assert r["not_matching_ABC_architectures"] and r["original_ABC_results_untouched"]
          print("Official independent MetaDrive RecurrentPPO smoke verified:",r["eval_success"],"/12 success")
          PY
          {
            echo "## D2i official SB3-Contrib training-system control"
            echo "- Dedicated root-disk overlay venv inherits old torch+MetaDrive, but overrides incompatible gymnasium"
            echo "- Core dls-p0 was verified UNCHANGED"
            echo "- SB3 and SB3-Contrib pinned 2.6.0; dry-run and pip check passed"
            echo "- Official RecurrentPPO 4-way parallel MetaDrive, 16384 environment frames"
            echo "- Fresh evaluation seeds 5400..5411 are outside all training ranges"
            echo "- Model/VecNormalize/results on data disk, no A/B/C weights modified"
            echo "- This is NOT a comparable A/B/C result or a converged RL baseline"
          } >> "$GITHUB_STEP_SUMMARY"
