name: DLS D3d free learned motor coordination topology

on:
  push:
    paths:
      - .github/workflows/d3d-free-routing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d3d-free-routing
  cancel-in-progress: false

jobs:
  free-routing:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_DATA_ID: d1-longitudinal-v1-44117653285
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PYTHONPATH: /mnt/datasets/lxb/dls/tmp
    steps:
      - name: Check existing D3a/D3c data and immutable output paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test -x "$DLS_ENV/bin/python"
          test -s "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3c-pairing-v1/aggregate.json"
          test ! -e "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3d-free-routing-v1/aggregate.json"
          for seed in 42 43 44; do
            test -s "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3-identifiability-v1/calibration-data-seed$seed.npz"
            test -s "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3-identifiability-v1/d3a-seed$seed.json"
            test -s "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3c-pairing-v1/data-seed$seed.json"
            test ! -e "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3d-free-routing-v1/data-seed$seed.json"
          done
          mkdir -p "$TMPDIR"
          nvidia-smi -L

      - name: Fetch and compile pinned architecture and free-routing trainer
        shell: bash
        run: |
          set -euo pipefail
          for item in "scripts/d3_artificial_group_calibration.py:d3_artificial_group_calibration.py" \
                      "scripts/d3d_free_routing.py:d3d_free_routing.py"; do
            SRC="${item%%:*}"
            NAME="${item#*:}"
            RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$SRC"
            OK=0
            for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
              if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/$NAME"; then
                OK=1
                break
              fi
            done
            test "$OK" = 1
            "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/$NAME"
            sha256sum "$TMPDIR/$NAME"
          done

      - name: Train learned independent module partners on 3 GPUs
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a SEEDS=()
          for gpu in 0 1 2; do
            seed=$((42+gpu))
            "$DLS_ENV/bin/python" "$TMPDIR/d3d_free_routing.py" \
              --data-seed "$seed" --gpu "$gpu" \
              > "$DLS_DATA_ROOT/tmp/d3d-${GITHUB_RUN_ID}-seed$seed.log" 2>&1 &
            PIDS+=("$!")
            SEEDS+=("$seed")
          done
          failed=0
          for i in "${!PIDS[@]}"; do
            if wait "${PIDS[$i]}"; then
              echo "PASS D3d data-seed${SEEDS[$i]}"
              grep -E "D3d data=" "$DLS_DATA_ROOT/tmp/d3d-${GITHUB_RUN_ID}-seed${SEEDS[$i]}.log"
            else
              echo "FAIL D3d data-seed${SEEDS[$i]}"
              tail -120 "$DLS_DATA_ROOT/tmp/d3d-${GITHUB_RUN_ID}-seed${SEEDS[$i]}.log"
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Audit all learned route graphs and comparison against D3c matched checkpoints
        shell: bash
        run: |
          set -euo pipefail
          "$DLS_ENV/bin/python" - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          import numpy as np
          root=Path(os.environ["DLS_DATA_ROOT"])
          data_id=os.environ["DLS_DATA_ID"]
          report_dir=root/"reports"/data_id/"d3d-free-routing-v1"
          checkpoint_dir=root/"checkpoints"/data_id/"d3d-free-routing-v1"
          archive_root=root/"reports"/data_id/"d3-identifiability-v1"
          out=report_dir/"aggregate.json"
          assert not out.exists()
          rows=[]
          for seed in (42,43,44):
              p=report_dir/f"data-seed{seed}.json"
              r=json.loads(p.read_text())
              assert r["data_seed"]==seed
              a=archive_root/f"calibration-data-seed{seed}.npz"
              assert hashlib.sha256(a.read_bytes()).hexdigest()==r["input_data_sha256"]
              assert len(r["rows"])==6
              for rec in r["rows"]:
                  assert rec["data_seed"]==seed
                  assert rec["task"] in ("interaction","additive")
                  assert rec["init_seed"] in (501,502,503)
                  assert np.isfinite(rec["test"]["mse"])
                  assert len(rec["graph"]["chosen_senders_by_receiver"])==4
                  for i,j in enumerate(rec["graph"]["chosen_senders_by_receiver"]):
                      assert j==-1 or (0<=j<4 and i!=j)
                  assert rec["router_num_parameters"]==16
                  assert len(rec["history"])==10
                  assert Path(rec["checkpoint"])==checkpoint_dir/f"{rec['task']}-d{seed}-i{rec['init_seed']}.pt"
                  assert Path(rec["checkpoint"]).is_file()
                  rows.append(rec)
          assert len(rows)==18
          results={}
          for task in ("interaction","additive"):
              data=[r for r in rows if r["task"]==task]
              assert len(data)==9
              results[task]={
                  "n":len(data),
                  "true_reciprocal_pairs_emerged":sum(r["graph"]["complete_true_pairing"] for r in data),
                  "two_disjoint_reciprocal_pairs_emerged":sum(r["graph"]["two_disjoint_reciprocal_pairs"] for r in data),
                  "mean_correct_directed_edges":float(np.mean([r["graph"]["correct_edges_against_positive_task_ground_truth"] for r in data])),
                  "mean_active_directed_edges":float(np.mean([r["graph"]["num_active_edges"] for r in data])),
                  "mean_test_mse_free":float(np.mean([r["test"]["mse"] for r in data])),
                  "mean_test_mse_fixed_validation_selected":float(np.mean([r["fixed_pairing_val_selected_reference"]["test_mse"] for r in data])),
                  "mean_test_mse_fixed_no_comm":float(np.mean([r["fixed_no_comm_test_mse"] for r in data])),
                  "free_beats_fixed_no_comm_count":sum(r["test"]["mse"]<r["fixed_no_comm_test_mse"] for r in data),
                  "mean_test_free_minus_val_selected_fixed":float(np.mean([r["test"]["mse"]-r["fixed_pairing_val_selected_reference"]["test_mse"] for r in data])),
                  "rows":[{
                      "data_seed":r["data_seed"],"init_seed":r["init_seed"],
                      "senders":r["graph"]["chosen_senders_by_receiver"],
                      "exact_true_group":r["graph"]["complete_true_pairing"],
                      "active_edges":r["graph"]["num_active_edges"],
                      "hard_test_mse":r["test"]["mse"],
                      "best_epoch":r["best_epoch"],
                  } for r in data]
              }
          result={
              "stage":"D3d unconstrained directed partner learning",
              "scope":"longitudinal driving-state surrogate; NOT MetaDrive closed loop",
              "samples":"3 data seeds x 3 model init seeds x 2 task types = 18 learned routing controllers",
              "architecture":"each of 4 modules selects ONE sender or silence independently; no fixed reciprocal pairing",
              "reference":"matched D3c fully retrained oracle topology and no-communication controls",
              "scientific_gate":{
                  "positive_exact_group_recovery_9of9":results["interaction"]["true_reciprocal_pairs_emerged"]==9,
                  "positive_majority_exact_group_recovery":results["interaction"]["true_reciprocal_pairs_emerged"]>=5,
                  "positive_beats_no_comm_all_9":results["interaction"]["free_beats_fixed_no_comm_count"]==9,
                  "additive_no_reciprocal_pseudo_group":results["additive"]["two_disjoint_reciprocal_pairs_emerged"]==0,
              },
              "summary":results,
          }
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2),flush=True)
          PY
          {
            printf '%s\n' "## D3d independent learned communication partners"
            printf '%s\n' "- 18 models, three GPU parallelism"
            printf '%s\n' "- No preset pair labels, each module can communicate with any other or nobody"
            printf '%s\n' "- Separate complementary computation and additive function"
            printf '%s\n' "- Matched frozen D3c fixed-pairing and no-communication comparison"
            printf '%s\n' "- Report: $DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3d-free-routing-v1/aggregate.json"
          } >> "$GITHUB_STEP_SUMMARY"
