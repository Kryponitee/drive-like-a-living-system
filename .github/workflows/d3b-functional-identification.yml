name: DLS D3b functional identifiability hard-negative audit

on:
  push:
    paths:
      - .github/workflows/d3b-functional-identification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d3b-functional-audit
  cancel-in-progress: false

jobs:
  functional:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_DATA_ID: d1-longitudinal-v1-44117653285
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: /mnt/datasets/lxb/dls/tmp
    steps:
      - name: Verify completed D3a/D3b training and reserve fresh read-only analysis outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test -x "$DLS_ENV/bin/python"
          test -s "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3-identifiability-v1/aggregate.json"
          for seed in 42 43 44; do
            test -s "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3-identifiability-v1/d3a-seed$seed.json"
            test -s "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3-identifiability-v1/d3b-seed$seed.json"
            test ! -e "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3-identifiability-v1/d3b-functional-seed$seed.json"
          done
          test ! -e "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3-identifiability-v1/functional-aggregate.json"
          mkdir -p "$TMPDIR"

      - name: Download and compile pinned frozen model and functional identifier
        shell: bash
        run: |
          set -euo pipefail
          for item in "scripts/d3_artificial_group_calibration.py:d3_artificial_group_calibration.py" \
                      "scripts/d3b_functional_interaction.py:d3b_functional_interaction.py"; do
            SRC="${item%%:*}"
            NAME="${item#*:}"
            RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$SRC"
            OK=0
            for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
              if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/$NAME"; then
                OK=1
                break
              fi
            done
            test "$OK" = 1
            "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/$NAME"
          done

      - name: Read-only function-level double-perturbation assay on 3 seeds
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a SEEDS=()
          for gpu in 0 1 2; do
            seed=$((42+gpu))
            "$DLS_ENV/bin/python" "$TMPDIR/d3b_functional_interaction.py" --seed "$seed" --gpu "$gpu" \
              > "$DLS_DATA_ROOT/tmp/d3b-functional-${GITHUB_RUN_ID}-seed$seed.log" 2>&1 &
            PIDS+=("$!")
            SEEDS+=("$seed")
          done
          failed=0
          for i in "${!PIDS[@]}"; do
            if wait "${PIDS[$i]}"; then
              echo "PASS seed${SEEDS[$i]}"
              tail -20 "$DLS_DATA_ROOT/tmp/d3b-functional-${GITHUB_RUN_ID}-seed${SEEDS[$i]}.log"
            else
              echo "FAIL seed${SEEDS[$i]}"
              tail -100 "$DLS_DATA_ROOT/tmp/d3b-functional-${GITHUB_RUN_ID}-seed${SEEDS[$i]}.log"
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Audit aggregate positive recovery and wired-null false positives
        shell: bash
        run: |
          set -euo pipefail
          "$DLS_ENV/bin/python" - <<'PY'
          from pathlib import Path
          import os,json,numpy as np
          p=Path(os.environ["DLS_DATA_ROOT"])/"reports"/os.environ["DLS_DATA_ID"]/"d3-identifiability-v1"
          rows=[]
          for seed in (42,43,44):
              a=json.loads((p/f"d3b-functional-seed{seed}.json").read_text())
              assert a["seed"]==seed
              assert a["test_samples"]==1024
              assert set(a["all_variants"])=={"paired","no_comm","wrong_pair","null_unwired","null_wired"}
              rows.append({
                  "seed":seed,
                  "threshold":a["calibrated_threshold"],
                  "true":a["ground_truth_revealed_only_after_prediction"],
                  "prediction":a["all_variants"]["paired"]["blind_group_inference"]["pairs"],
                  "positive_exact":a["positive_exact_recovery"],
                  "null_wired_fp":a["null_wired_false_positive"],
                  "null_unwired_fp":a["null_unwired_false_positive"],
                  "scientific_pass":a["scientific_pass"],
              })
          out={
            "stage":"D3b functional identifiability hard-negative test",
            "rows":rows,
            "positive_exact_recovered":sum(r["positive_exact"] for r in rows),
            "wired_null_false_positive_count":sum(r["null_wired_fp"] for r in rows),
            "unwired_null_false_positive_count":sum(r["null_unwired_fp"] for r in rows),
            "scientific_all_pass":all(r["scientific_pass"] for r in rows),
          }
          q=p/"functional-aggregate.json"
          assert not q.exists()
          q.write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2),flush=True)
          PY
          {
            printf '%s\n' "## D3b function-level mixed-partial identification"
            printf '%s\n' "- 3 frozen positive seeds and strong wired additive-function negatives"
            printf '%s\n' "- Threshold calibrated ONLY on validation null; tested on held-out test"
            printf '%s\n' "- All interventions conducted on pre-sigmoid motor outputs"
            printf '%s\n' "- Summary: $DLS_DATA_ROOT/reports/$DLS_DATA_ID/d3-identifiability-v1/functional-aggregate.json"
          } >> "$GITHUB_STEP_SUMMARY"
