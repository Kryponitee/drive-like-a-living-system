name: DLS D0 GPU training runtime

on:
  push:
    paths:
      - .github/workflows/d0-gpu-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-runtime:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      PIP_CACHE_DIR: /mnt/datasets/lxb/dls/cache/pip
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Verify resources and existing isolated environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test "$(findmnt -n -o TARGET -T "$DLS_ENV")" = "/"
          test -x "$DLS_ENV/bin/python"
          test -f "$DLS_DATA_ROOT/metadrive_assets/version.txt"
          mkdir -p "$PIP_CACHE_DIR" "$XDG_CACHE_HOME" "$TMPDIR" "$DLS_DATA_ROOT/reports/d0"
          avail="$(df -Pk "$DLS_ENV" | awk 'NR==2 {print $4}')"
          test "$avail" -gt 26214400
          nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
          df -h "$DLS_ENV" "$DLS_DATA_ROOT"

      - name: Install PyTorch and TensorBoard in dls-p0
        shell: bash
        run: |
          set -euo pipefail
          "$DLS_ENV/bin/python" -m pip install --no-input --disable-pip-version-check \
            'torch==2.5.1' 'tensorboard>=2.15,<3'
          "$DLS_ENV/bin/python" -m pip check
          "$DLS_ENV/bin/python" - <<'PY'
          import json
          from pathlib import Path
          import torch
          import tensorboard
          import metadrive
          assert torch.cuda.is_available(), "GPU unavailable in DLS environment"
          detected = torch.cuda.device_count()
          assert detected >= 1
          a = torch.randn(256, 256, device="cuda:0")
          b = a @ a.T
          torch.cuda.synchronize()
          assert torch.isfinite(b).all().item()
          report = {
              "torch": torch.__version__,
              "cuda_runtime": torch.version.cuda,
              "cuda_available": True,
              "gpu_count": detected,
              "gpus": [torch.cuda.get_device_name(i) for i in range(detected)],
              "tensorboard": tensorboard.__version__,
              "test": "CUDA matrix product PASS",
          }
          path = Path("/mnt/datasets/lxb/dls/reports/d0/gpu_runtime.json")
          path.write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY
          "$DLS_ENV/bin/python" -m pip freeze > "$DLS_DATA_ROOT/reports/d0/pip_freeze.txt"
          {
            echo "## DLS GPU runtime"
            echo "- Conda: \`$DLS_ENV\`"
            echo "- Report: \`$DLS_DATA_ROOT/reports/d0/gpu_runtime.json\`"
            echo "- CUDA validation PASS"
          } >> "$GITHUB_STEP_SUMMARY"
