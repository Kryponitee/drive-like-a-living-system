name: DLS D2b 3-GPU recurrent PPO bounded pilot

on:
  push:
    paths:
      - .github/workflows/d2b-ppo-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d2b-ppo-v1
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 80
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      DLS_D2_TRAINING: "1"
    steps:
      - name: Verify existing simulator, math audit, checkpoints and isolated storage
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test "$(findmnt -n -o TARGET -T "$DLS_ENV")" = "/"
          test -f "$DLS_DATA_ROOT/reports/d2a/d2a-summary.json"
          test -f "$DLS_DATA_ROOT/metadrive_assets/version.txt"
          for variant in A B C; do
            test -f "$DLS_DATA_ROOT/checkpoints/d1-v1/$variant-seed42.pt"
          done
          "$DLS_ENV/bin/python" -c 'import torch; assert torch.cuda.device_count() >= 3'
          test "$(df -Pk "$DLS_DATA_ROOT" | awk 'NR==2 {print $4}')" -gt 10485760
          mkdir -p "$TMPDIR" "$DLS_DATA_ROOT/reports/d2b/train-logs" "$DLS_DATA_ROOT/reports/d2b/eval-logs" "$DLS_DATA_ROOT/checkpoints/d2b-v1"
          df -h "$DLS_DATA_ROOT"

      - name: Reuse exact model distribution and PPO source version for all variants
        shell: bash
        run: |
          set -euo pipefail
          for item in "src/dls_p0.py:dls_p0.py" \
                      "src/dls_recurrent_ppo.py:dls_recurrent_ppo.py" \
                      "scripts/d2b_train.py:d2b_train.py" \
                      "scripts/d2b_eval.py:d2b_eval.py"; do
            SRC="${item%%:*}"
            TARGET="${item#*:}"
            RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$SRC"
            OK=0
            for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
              if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/$TARGET"; then
                OK=1
                break
              fi
            done
            test "$OK" = 1
            "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/$TARGET"
            sha256sum "$TMPDIR/$TARGET"
          done

      - name: Train three frozen-BC initializations concurrently with equal 4096 environment steps each
        shell: bash
        run: |
          set -euo pipefail
          declare -a VARIANTS=(A B C)
          declare -a PIDS=()
          for i in 0 1 2; do
            variant="${VARIANTS[$i]}"
            "$DLS_ENV/bin/python" "$TMPDIR/d2b_train.py" --variant "$variant" \
              --model-seed 42 --gpu "$i" --env-steps 4096 --rollout 128 \
              > "$DLS_DATA_ROOT/reports/d2b/train-logs/$variant.log" 2>&1 &
            PIDS+=("$!")
          done
          failures=0
          for i in 0 1 2; do
            variant="${VARIANTS[$i]}"
            if wait "${PIDS[$i]}"; then
              echo "PASS D2b train $variant"
              tail -20 "$DLS_DATA_ROOT/reports/d2b/train-logs/$variant.log"
            else
              echo "FAIL D2b train $variant"
              tail -90 "$DLS_DATA_ROOT/reports/d2b/train-logs/$variant.log"
              failures=1
            fi
          done
          test "$failures" = 0

      - name: Evaluate BC-before, PPO-after and expert on identical new scenes using 21 CPU processes
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a NAMES=()
          for phase in bc ppo expert; do
            if test "$phase" = expert; then
              VARIANTS=(expert)
            else
              VARIANTS=(A B C)
            fi
            for variant in "${VARIANTS[@]}"; do
              for density in 0.00 0.10 0.25; do
                name="$phase-$variant-density$density"
                "$DLS_ENV/bin/python" "$TMPDIR/d2b_eval.py" \
                  --phase "$phase" --variant "$variant" --density "$density" \
                  > "$DLS_DATA_ROOT/reports/d2b/eval-logs/$name.log" 2>&1 &
                PIDS+=("$!")
                NAMES+=("$name")
              done
            done
          done
          test "${#PIDS[@]}" = 21
          failures=0
          for i in "${!PIDS[@]}"; do
            if wait "${PIDS[$i]}"; then
              echo "PASS ${NAMES[$i]}"
              grep "success=" "$DLS_DATA_ROOT/reports/d2b/eval-logs/${NAMES[$i]}.log" | tail -1
            else
              echo "FAIL ${NAMES[$i]}"
              tail -70 "$DLS_DATA_ROOT/reports/d2b/eval-logs/${NAMES[$i]}.log"
              failures=1
            fi
          done
          test "$failures" = 0

      - name: Compare before-after paired scenes without claiming communication superiority
        shell: bash
        run: |
          set -euo pipefail
          "$DLS_ENV/bin/python" - <<'PY'
          from pathlib import Path
          import json
          root=Path("/mnt/datasets/lxb/dls/reports/d2b")
          result={
              "stage":"D2b bounded PPO baseline before-vs-after correctness pilot",
              "environment_steps_per_variant":4096,
              "train_density":0.1,
              "train_seed":42,
              "eval_scenarios":list(range(3300,3312)),
              "training_only_one_initialization":True,
              "interpretation":"Any gains in this single-seed/short-budget experiment are diagnostic, not causal evidence for modular communication.",
              "models":{},
          }
          for variant in "ABC":
              training=json.loads((root/f"train-{variant}-seed42.json").read_text())
              assert training["environment_steps"] == 4096
              assert training["max_ppo_behavior_replay_error"] < 3e-5
              by_density={}
              for density in (0.0, 0.1, 0.25):
                  pair=[]
                  for phase in ("bc","ppo"):
                      info=json.loads((root/f"eval-{phase}-{variant}-density{density:.2f}.json").read_text())
                      assert info["seeds"] == list(range(3300,3312))
                      pair.append(info)
                  old,new=pair
                  wins=sum(not a["success"] and b["success"] for a,b in zip(old["episodes"],new["episodes"]))
                  losses=sum(a["success"] and not b["success"] for a,b in zip(old["episodes"],new["episodes"]))
                  by_density[str(density)]={
                      "BC_success": old["success"], "PPO_success":new["success"],
                      "BC_collision":old["collision"],"PPO_collision":new["collision"],
                      "BC_out_of_road":old["offroad"],"PPO_out_of_road":new["offroad"],
                      "PPO_only_success":wins,"BC_only_success":losses,
                      "PPO_minus_BC_success":wins-losses,
                  }
              result["models"][variant]={"training":{
                  "environment_steps":training["environment_steps"],
                  "updates":training["updates"],
                  "policy_parameter_count":training["policy_param_count"],
                  "mean_approx_kl_last_epoch":training["mean_approx_kl_last_epoch"],
                  "max_ppo_behavior_replay_error":training["max_ppo_behavior_replay_error"]},
                  "by_density":by_density}
          assert result["models"]["B"]["training"]["policy_parameter_count"] == result["models"]["C"]["training"]["policy_parameter_count"]
          result["expert_reference"]={}
          for density in (0.0,0.1,0.25):
              teacher=json.loads((root/f"eval-expert-expert-density{density:.2f}.json").read_text())
              result["expert_reference"][str(density)]={"success":teacher["success"],
                  "collision":teacher["collision"],"out_of_road":teacher["offroad"]}
          path=root/"d2b-summary.json"
          path.write_text(json.dumps(result,indent=2),encoding="utf-8")
          for variant in "ABC":
              for density, metrics in result["models"][variant]["by_density"].items():
                  print(variant, density, "BC->PPO",
                        metrics["BC_success"], "->",metrics["PPO_success"],
                        "net",metrics["PPO_minus_BC_success"])
          print("Expert:", result["expert_reference"])
          PY
          {
            echo "## D2b recurrent PPO constrained pilot"
            echo "- Reused BC checkpoints, PyTorch/CUDA and MetaDrive assets"
            echo "- Exact same 4096 environment transitions for A/B/C (one seed pilot)"
            echo "- Recurrent state rebuilt after PPO updates, continuous rollout ratio checked"
            echo "- New test seeds 3300..3311 compare BC-before and PPO-after, expert baseline"
            echo "- Report: \`$DLS_DATA_ROOT/reports/d2b/d2b-summary.json\`"
            echo "- Not a D3 causal module communication result"
          } >> "$GITHUB_STEP_SUMMARY"
