name: DLS D2i-H cached-return critic history ON-OFF diagnostic

on:
  push:
    paths:
      - .github/workflows/d2i-history-critic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d2i-history-only
  cancel-in-progress: false

jobs:
  compare:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Verify frozen D2h full-episode train and validation datasets
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test "$(findmnt -n -o TARGET -T "$DLS_ENV")" = "/"
          test -f "$DLS_DATA_ROOT/reports/d2h/d2h-summary.json"
          "$DLS_ENV/bin/python" -c 'import torch; assert torch.cuda.device_count() >= 3'
          for variant in A B C; do
            for split in train validation; do
              test -s "$DLS_DATA_ROOT/rollouts/d2h-v1/$split-$variant.npz"
              test -s "$DLS_DATA_ROOT/rollouts/d2h-v1/$split-$variant.json"
            done
          done
          test "$(df -Pk "$DLS_DATA_ROOT" | awk 'NR==2 {print $4}')" -gt 10485760
          mkdir -p "$TMPDIR" "$DLS_DATA_ROOT/reports/d2i-history/logs" "$DLS_DATA_ROOT/checkpoints/d2i-history"
          test ! -f "$DLS_DATA_ROOT/reports/d2i-history/d2i-history-summary.json"

      - name: Fetch single exact critic history script from GitHub
        shell: bash
        run: |
          set -euo pipefail
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/d2i_history_critic_ablation.py"
          OK=0
          for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
            if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/d2i_history.py"; then
              OK=1
              break
            fi
          done
          test "$OK" = 1
          "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/d2i_history.py"
          sha256sum "$TMPDIR/d2i_history.py"

      - name: Train six equal-parameter critics on three GPUs with identical history ON/OFF batches
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a VARIANTS=(A B C)
          for gpu in 0 1 2; do
            variant="${VARIANTS[$gpu]}"
            "$DLS_ENV/bin/python" "$TMPDIR/d2i_history.py" --variant "$variant" --gpu "$gpu" \
              > "$DLS_DATA_ROOT/reports/d2i-history/logs/$variant.log" 2>&1 &
            PIDS+=("$!")
          done
          failed=0
          for i in "${!PIDS[@]}"; do
            variant="${VARIANTS[$i]}"
            if wait "${PIDS[$i]}"; then
              echo "PASS critic-history $variant"
              tail -8 "$DLS_DATA_ROOT/reports/d2i-history/logs/$variant.log"
            else
              echo "FAIL critic-history $variant"
              tail -90 "$DLS_DATA_ROOT/reports/d2i-history/logs/$variant.log"
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Apply predeclared ON-vs-OFF conclusion rule, no cherry-picking
        shell: bash
        run: |
          set -euo pipefail
          "$DLS_ENV/bin/python" - <<'PY'
          import json
          from pathlib import Path
          root=Path("/mnt/datasets/lxb/dls/reports/d2i-history")
          table={}
          for variant in "ABC":
              r=json.loads((root/f"history-ablation-{variant}-seed42.json").read_text())
              assert r["no_actor_update"] and r["no_new_simulation"]
              assert r["same_model_architecture_and_parameter_count"]==20545
              assert r["same_initial_critic_weights"] and r["history_window"]==64
              assert r["train_valid_steps"]>=1000 and r["validation_valid_steps"]>=1000
              results=r["validation_metrics"]
              on=results["on"]
              off=results["off"]
              relative=(off["RMSE"]-on["RMSE"])/off["RMSE"]
              assert abs(relative-r["validation_relative_RMSE_improvement_ON_over_OFF"])<1e-10
              table[variant]={
                  "history_on_RMSE":on["RMSE"],
                  "history_off_RMSE":off["RMSE"],
                  "history_on_EV":on["explained_variance"],
                  "history_off_EV":off["explained_variance"],
                  "relative_RMSE_gain_history_on":relative,
                  "mean_episode_MAE_on":on["mean_episode_MAE"],
                  "mean_episode_MAE_off":off["mean_episode_MAE"],
                  "supports_criterion":relative>=0.05 and on["explained_variance"]>0,
              }
              print(variant,table[variant])
          passed=sum(x["supports_criterion"] for x in table.values())
          report={
              "stage":"D2i-H equal-parameter GRU critic 64-step HISTORY ON vs OFF",
              "source_data":"Cached D2h train/validation complete-episode returns",
              "new_simulator_steps":0,
              "actor_updates":0,
              "parameter_count_each":20545,
              "fixed_epochs":50,
              "fixed_train_loss":"raw-return MSE with identical train-only target affine scaling",
              "predeclared_gate":"History-ON improves held-out RMSE >=5% with positive EV in >=2 of A/B/C actor occupancy distributions",
              "criterion_positive_distributions":passed,
              "supports_History_motivated_critic_further_study":passed>=2,
              "models":table,
              "caveat":"24 train/16 validation scene seeds per actor; episode steps correlated, 64-step truncation, no claim of PPO or communication causality.",
          }
          path=root/"d2i-history-summary.json"
          assert not path.exists()
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("Criteria satisfied on",passed,"of three actor occupancy distributions")
          PY
          {
            echo "## D2i-H critic history ON/OFF"
            echo "- Uses cached D2h rollouts: no simulation, no model actor/PPO updates"
            echo "- Identical 20545-parameter GRU actor-independent critics with history state ON or OFF"
            echo "- Equal initial weights, minibatches, 50 epochs and model capacity"
            echo "- Summary: \`$DLS_DATA_ROOT/reports/d2i-history/d2i-history-summary.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
