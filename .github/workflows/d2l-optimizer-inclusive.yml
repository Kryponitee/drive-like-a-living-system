name: DLS D2l reuse existing full-PPO benchmark; no duplicate training

on:
  push:
    paths:
      - .github/workflows/d2l-optimizer-inclusive.yml
  workflow_dispatch:

permissions:
  contents: read

# This supersedes the queued duplicate 16k-frame benchmark, WITHOUT canceling
# the already running authoritative 32k-frame D2l benchmark (different group).
concurrency:
  group: dls-d2l-optimizer-inclusive
  cancel-in-progress: true

jobs:
  read_only_audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      SB3_VENV: /home/ps/miniconda3/envs/dls-sb3-compat
    steps:
      - name: Reuse previously running 32k-frame matched D2l and assert reported optimizer work
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          RESULT="$DLS_DATA_ROOT/reports/d2l/full-ppo-worker-comparison.json"
          if test ! -s "$RESULT"; then
            echo "Earlier D2l run is still producing its read-only results."
            echo "Source: https://github.com/Kryponitee/drive-like-a-living-system/actions/runs/44030181386"
            echo "No additional simulator or optimizer work launched."
            exit 0
          fi
          "$SB3_VENV/bin/python" - <<'PY'
          import json
          from pathlib import Path
          p=Path("/mnt/datasets/lxb/dls/reports/d2l/full-ppo-worker-comparison.json")
          report=json.loads(p.read_text())
          rows=report["results"]
          assert [r["workers"] for r in rows] == [32,64]
          assert all(r["total_training_frames"]==32768 for r in rows)
          assert rows[0]["optimizer_steps"]==rows[1]["optimizer_steps"]>0
          assert all(r["source_checkpoint_unchanged"] for r in rows)
          for r in rows:
              print(r["workers"],"workers, full PPO FPS",round(r["frames_per_second_optimizer_inclusive"],2),
                    "optimizer steps",r["optimizer_steps"])
          print("Preferred:",report["preferred_worker_count"],
                "64/32 speedup:",round(report["worker_64_speedup_vs_32"],3))
          PY
          {
            echo "## Reused existing D2l full PPO performance results"
            echo "- Authoritative run: https://github.com/Kryponitee/drive-like-a-living-system/actions/runs/44030181386"
            echo "- No extra training, environments, checkpoints or dependencies installed"
            echo "- Results: \`$RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"
