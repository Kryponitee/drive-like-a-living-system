name: DLS D3d original C fast recurrent memory reset three-seed diagnostic

on:
  push:
    paths:
      - .github/workflows/d3d-fast-hidden-reset.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d3d-recurrent-necessity
  cancel-in-progress: false

jobs:
  memory:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 28
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Check D3c per-seed controls and frozen original D1 C models
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test -f "$DLS_DATA_ROOT/reports/d3c/d3c-summary.json"
          for seed in 42 43 44; do
            test -f "$DLS_DATA_ROOT/checkpoints/d1-v1/C-seed$seed.pt"
            test -f "$DLS_DATA_ROOT/reports/d3c/eval-C-seed$seed-baseline-density0.10.json"
            test -f "$DLS_DATA_ROOT/reports/d3c/eval-C-seed$seed-self-density0.10.json"
          done
          test ! -e "$DLS_DATA_ROOT/reports/d3d/d3d-summary.json"
          mkdir -p "$TMPDIR" "$DLS_DATA_ROOT/reports/d3d/logs"
          sha256sum "$DLS_DATA_ROOT/checkpoints/d1-v1/"C-seed{42,43,44}.pt \
            > "$DLS_DATA_ROOT/reports/d3d/BC-C-sha256-before.txt"
          test "$(df -Pk "$DLS_DATA_ROOT" | awk 'NR==2 {print $4}')" -gt 10485760

      - name: Fetch exact original C policy and fast hidden reset experimental script
        shell: bash
        run: |
          set -euo pipefail
          for item in "src/dls_p0.py:dls_p0.py" \
                      "scripts/d3d_fast_hidden_reset.py:d3d.py"; do
            SRC="${item%%:*}"
            TARGET="${item#*:}"
            RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$SRC"
            OK=0
            for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
              if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/$TARGET"; then
                OK=1
                break
              fi
            done
            test "$OK" = 1
            "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/$TARGET"
            sha256sum "$TMPDIR/$TARGET"
          done

      - name: Evaluate only the new hidden-reset condition in three independent BC training seeds
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a SEEDS=(42 43 44)
          for seed in "${SEEDS[@]}"; do
            "$DLS_ENV/bin/python" "$TMPDIR/d3d.py" --model-seed "$seed" \
              > "$DLS_DATA_ROOT/reports/d3d/logs/seed$seed.log" 2>&1 &
            PIDS+=("$!")
          done
          failure=0
          for i in "${!PIDS[@]}"; do
            seed="${SEEDS[$i]}"
            if wait "${PIDS[$i]}"; then
              echo "PASS seed$seed"
              tail -1 "$DLS_DATA_ROOT/reports/d3d/logs/seed$seed.log"
            else
              echo "FAIL seed$seed"
              tail -80 "$DLS_DATA_ROOT/reports/d3d/logs/seed$seed.log"
              failure=1
            fi
          done
          test "$failure" = 0

      - name: Compare hidden-reset and self-message replacement against cached D3c original episodes
        shell: bash
        run: |
          set -euo pipefail
          "$DLS_ENV/bin/python" - <<'PY'
          from pathlib import Path
          import json
          root=Path("/mnt/datasets/lxb/dls/reports")
          models={}
          for seed in (42,43,44):
              base=json.loads((root/f"d3c/eval-C-seed{seed}-baseline-density0.10.json").read_text())
              self_msg=json.loads((root/f"d3c/eval-C-seed{seed}-self-density0.10.json").read_text())
              reset=json.loads((root/f"d3d/reset-C-seed{seed}.json").read_text())
              assert reset["bc_seed"]==seed
              for r in (base,self_msg,reset):
                  episodes=r["episodes"]
                  assert [e["seed"] for e in episodes]==list(range(32000,32024))
              assert reset["source_sha256"]==base["source_checkpoint_sha256"]==self_msg["source_checkpoint_sha256"]
              models[str(seed)]={
                  "baseline_success":base["success"],
                  "own_message_success":self_msg["success"],
                  "hidden_reset_success":reset["success"],
                  "baseline_mean_reward":base["mean_raw_reward"],
                  "own_message_mean_reward":self_msg["mean_raw_reward"],
                  "hidden_reset_mean_reward":reset["mean_raw_reward"],
                  "own_minus_base_reward":self_msg["mean_raw_reward"]-base["mean_raw_reward"],
                  "reset_minus_base_reward":reset["mean_raw_reward"]-base["mean_raw_reward"],
                  "own_minus_base_success":self_msg["success"]-base["success"],
                  "reset_minus_base_success":reset["success"]-base["success"],
                  "mean_erased_hidden_abs":reset["mean_discarded_fast_hidden_L1_per_coordinate"],
                  "per_scene_reset_reward_delta":[x["reward"]-y["reward"] for x,y in zip(reset["episodes"],base["episodes"])],
              }
              print("D3d seed",seed,"baseline/self-only/reset success",
                    models[str(seed)]["baseline_success"],
                    models[str(seed)]["own_message_success"],
                    models[str(seed)]["hidden_reset_success"],
                    "reset reward change",round(models[str(seed)]["reset_minus_base_reward"],2))
          summary={
              "stage":"D3d three trained BC C variants, fast recurrent state reset versus direct cross-message removal",
              "source_C_training_seeds":[42,43,44],
              "eval_scenes":list(range(32000,32024)),
              "traffic_density":0.10,
              "new_simulator_episodes":72,
              "original_or_cross_message_control_episodes_reused":144,
              "new_training_steps":0,
              "exact_intervention":"Before every control tick zero h_{t-1} for all 4 GRU modules but retain z slow state and same current 259D observation",
              "models":models,
              "interpretation_boundary":"This tests necessity of retaining fast recurrent state in the trained policy, NOT intrinsic environmental memory requirement; hidden-reset induces OOD model state.",
          }
          target=root/"d3d/d3d-summary.json"
          assert not target.exists()
          target.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          sha256sum "$DLS_DATA_ROOT/checkpoints/d1-v1/"C-seed{42,43,44}.pt \
            > "$DLS_DATA_ROOT/reports/d3d/BC-C-sha256-after.txt"
          cmp "$DLS_DATA_ROOT/reports/d3d/BC-C-sha256-before.txt" \
              "$DLS_DATA_ROOT/reports/d3d/BC-C-sha256-after.txt"
          {
            echo "## D3d C fast recurrent memory necessity"
            echo "- Three frozen BC models, 72 new memory-reset episodes"
            echo "- 144 previous D3c original/self-message episodes reused on identical scenes"
            echo "- Preserves current observations, every5-step slow-state z; zeros only incoming GRU h each tick"
            echo "- Summary: \`$DLS_DATA_ROOT/reports/d3d/d3d-summary.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
