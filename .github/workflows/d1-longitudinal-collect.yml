name: DLS D1-prime collect longitudinal dual-pedal dataset

on:
  push:
    paths:
      - .github/workflows/d1-longitudinal-collect.yml
      - scripts/d1_longitudinal_collect.py
      - src/dls_dual_pedal_adapter.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d1-longitudinal-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Verify runner and reserve a new immutable dataset ID
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test -x "$DLS_ENV/bin/python"
          test -s "$DLS_DATA_ROOT/metadrive_assets/version.txt"
          DATA_ID="d1-longitudinal-v1-${GITHUB_RUN_ID}"
          test ! -e "$DLS_DATA_ROOT/demonstrations/$DATA_ID"
          test ! -e "$DLS_DATA_ROOT/reports/$DATA_ID"
          mkdir -p "$TMPDIR"
          df -h "$DLS_DATA_ROOT"

      - name: Download and compile pinned collection source
        shell: bash
        run: |
          set -euo pipefail
          for item in "src/dls_dual_pedal_adapter.py:dls_dual_pedal_adapter.py" \
                      "scripts/d1_longitudinal_collect.py:d1_longitudinal_collect.py"; do
            SRC="${item%%:*}"
            NAME="${item#*:}"
            RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$SRC"
            OK=0
            for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
              if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/$NAME"; then
                OK=1
                break
              fi
            done
            test "$OK" = 1
            "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/$NAME"
          done
          sha256sum "$TMPDIR/dls_dual_pedal_adapter.py" "$TMPDIR/d1_longitudinal_collect.py"

      - name: Collect 150 episodes with nine isolated CPU workers
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a NAMES=()
          launch() {
            local split="$1"
            local density="$2"
            local base="$3"
            local episodes="$4"
            local name="$split-density$density"
            "$DLS_ENV/bin/python" "$TMPDIR/d1_longitudinal_collect.py" \
              --split "$split" --density "$density" --base-seed "$base" --episodes "$episodes" \
              > "$DLS_DATA_ROOT/tmp/d1-collect-${GITHUB_RUN_ID}-$name.log" 2>&1 &
            PIDS+=("$!")
            NAMES+=("$name")
          }
          launch train 0.0 10000 30
          launch train 0.1 10100 30
          launch train 0.25 10200 30
          launch val 0.0 20000 10
          launch val 0.1 20100 10
          launch val 0.25 20200 10
          launch test 0.0 30000 10
          launch test 0.1 30100 10
          launch test 0.25 30200 10
          test "${#PIDS[@]}" -eq 9
          failed=0
          for i in "${!PIDS[@]}"; do
            if wait "${PIDS[$i]}"; then
              echo "PASS ${NAMES[$i]}"
            else
              echo "FAIL ${NAMES[$i]}"
              tail -100 "$DLS_DATA_ROOT/tmp/d1-collect-${GITHUB_RUN_ID}-${NAMES[$i]}.log"
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Audit split integrity, action range and teacher coverage
        shell: bash
        run: |
          set -euo pipefail
          "$DLS_ENV/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np

          root=Path(os.environ["DLS_DATA_ROOT"])
          data_id="d1-longitudinal-v1-"+os.environ["GITHUB_RUN_ID"]
          data_root=root/"demonstrations"/data_id
          report_root=root/"reports"/data_id
          densities=(0.0,0.1,0.25)
          expected={"train":30,"val":10,"test":10}
          seed_sets={s:set() for s in expected}
          totals={s:{"episodes":0,"success":0,"transitions":0,"brake":0,"throttle":0} for s in expected}
          for split,count in expected.items():
              for density in densities:
                  stem=f"density-{density:.2f}"
                  meta=json.loads((data_root/split/f"{stem}.json").read_text())
                  archive=data_root/split/f"{stem}.npz"
                  assert meta["split"]==split and meta["density"]==density
                  assert meta["num_attempted"]==count and archive.is_file()
                  assert meta["archive_sha256"]==__import__("hashlib").sha256(archive.read_bytes()).hexdigest()
                  with np.load(archive,allow_pickle=False) as z:
                      obs=z["observations"]; act=z["actions"]; nxt=z["next_observations"]
                      offsets=z["episode_offsets"]; seeds=z["episode_seeds"]; success=z["episode_success"]
                      assert obs.ndim==2 and obs.shape[1]==259
                      assert act.shape==(len(obs),2) and nxt.shape==obs.shape
                      assert offsets.shape==(count+1,) and offsets[0]==0 and offsets[-1]==len(obs)
                      assert len(seeds)==count and len(success)==count
                      assert np.isfinite(obs).all() and np.isfinite(act).all()
                      assert np.all(act>=0) and np.all(act<=1)
                      assert set(seeds.tolist()).isdisjoint(seed_sets[split])
                      seed_sets[split].update(seeds.tolist())
                      totals[split]["episodes"]+=count
                      totals[split]["success"]+=int(success.sum())
                      totals[split]["transitions"]+=len(obs)
                      totals[split]["brake"]+=int((act[:,1]>1e-3).sum())
                      totals[split]["throttle"]+=int((act[:,0]>1e-3).sum())
                  (report_root/f"{split}-{stem}.json").is_file()
          assert seed_sets["train"].isdisjoint(seed_sets["val"])
          assert seed_sets["train"].isdisjoint(seed_sets["test"])
          assert seed_sets["val"].isdisjoint(seed_sets["test"])
          for split in expected:
              rate=totals[split]["success"]/totals[split]["episodes"]
              assert rate>=0.80, (split,rate,totals[split])
          print(json.dumps({"data_id":data_id,"totals":totals},indent=2))
          PY
          {
            printf '%s\n' "## DLS D1-prime longitudinal dataset"
            printf '%s\n' "- Dataset ID: `d1-longitudinal-v1-${GITHUB_RUN_ID}`"
            printf '%s\n' "- 90 train + 30 validation + 30 test episodes; three traffic densities"
            printf '%s\n' "- 9 isolated CPU workers; disjoint scenario seeds; labels are independent [throttle, brake]"
            printf '%s\n' "- Old D1 data/checkpoints untouched"
          } >> "$GITHUB_STEP_SUMMARY"
