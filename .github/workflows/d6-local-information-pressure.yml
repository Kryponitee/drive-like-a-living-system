name: DLS D6 local information bottleneck and peer-message necessity

on:
  push:
    paths:
      - .github/workflows/d6-local-information-pressure.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d6-local-information-pressure
  cancel-in-progress: false

jobs:
  learn-local-vs-cross:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      DLS_D6_TRAINING: "1"
    steps:
      - name: Validate old resources and isolate D6 work
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test -s "$DLS_DATA_ROOT/reports/d5b/d5b-summary.json"
          test -s "$DLS_DATA_ROOT/demonstrations/d1-v1/train/worker-00-density-0.00.npz"
          "$DLS_ENV/bin/python" -c "import torch; assert torch.cuda.device_count() >= 3"
          mkdir -p "$TMPDIR" "$DLS_DATA_ROOT/reports/d6/logs"
          for seed in 42 43 44; do
            test -s "$DLS_DATA_ROOT/checkpoints/d1-v1/C-seed$seed.pt"
            for arm in local cross; do
              test ! -e "$DLS_DATA_ROOT/checkpoints/d6/$arm-seed$seed.pt"
              test ! -e "$DLS_DATA_ROOT/reports/d6/train-$arm-seed$seed.json"
            done
          done
          test ! -e "$DLS_DATA_ROOT/reports/d6/d6-summary.json"
          test ! -e "$DLS_DATA_ROOT/reports/d6/eval/seed42-density0.00-shard0.json"
          sha256sum "$DLS_DATA_ROOT/checkpoints/d1-v1/"C-seed{42,43,44}.pt > "$DLS_DATA_ROOT/reports/d6/original-C-sha256-before.txt"
          sha256sum "$DLS_DATA_ROOT/checkpoints/d5a/"{clean,robust}-seed{42,43,44}.pt > "$DLS_DATA_ROOT/reports/d6/original-D5a-sha256-before.txt"
          df -h "$DLS_DATA_ROOT"

      - name: Fetch pinned D1 dataset loader and D6 local motor implementation
        shell: bash
        run: |
          set -euo pipefail
          for item in "src/dls_p0.py:dls_p0.py" \
                      "scripts/d1_bc.py:d1_bc.py" \
                      "src/dls_local_motor.py:dls_local_motor.py" \
                      "scripts/d6_train_local_motor.py:d6_train_local_motor.py" \
                      "scripts/d6_eval_local_motor.py:d6_eval_local_motor.py" \
                      "scripts/d6_aggregate.py:d6_aggregate.py"; do
            SRC="${item%%:*}"
            NAME="${item#*:}"
            RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$SRC"
            OK=0
            for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
              if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/$NAME"; then
                OK=1
                break
              fi
            done
            test "$OK" = 1
            "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/$NAME"
          done
          "$DLS_ENV/bin/python" - <<'PY'
          import sys, os, torch
          sys.path.insert(0, os.environ["TMPDIR"])
          from dls_local_motor import LocalMotorController,num_params,run_sequence
          torch.set_num_threads(2)
          torch.manual_seed(42)
          L=LocalMotorController("local")
          torch.manual_seed(42)
          X=LocalMotorController("cross")
          assert num_params(L)==num_params(X)==114880
          assert all(torch.equal(a,b) for a,b in zip(L.parameters(), X.parameters()))
          torch.testing.assert_close(L.projection @ L.projection.T,torch.eye(259),atol=1e-4,rtol=1e-4)
          torch.testing.assert_close(L.projection,X.projection,atol=0,rtol=0)
          x=torch.randn(2,4,259)
          assert run_sequence(L,x).shape==(2,4,2)
          assert run_sequence(X,x).shape==(2,4,2)
          assert run_sequence(X,x,block_messages=True).shape==(2,4,2)
          with torch.no_grad():
              ys=run_sequence(X,x)
              yblocked=run_sequence(X,x,block_messages=True)
              assert not torch.allclose(ys,yblocked)
          loss=run_sequence(X,x).sum()
          loss.backward()
          assert torch.isfinite(X.decoder.grad).all()
          assert torch.isfinite(X.value_weights.grad).all()
          print("D6 smoke PASS: 8×33 row-orthogonal local input, 2 outputs, 114880 matching params, functional prior-step peer messages",flush=True)
          PY
          sha256sum "$TMPDIR/dls_local_motor.py" "$TMPDIR/d6_train_local_motor.py" "$TMPDIR/d6_eval_local_motor.py" "$TMPDIR/d6_aggregate.py"

      - name: Train matched local and cross eight-motor models on three independent GPUs
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a SEEDS=(42 43 44)
          for i in "${!SEEDS[@]}"; do
            seed="${SEEDS[$i]}"
            (
              for arm in local cross; do
                "$DLS_ENV/bin/python" "$TMPDIR/d6_train_local_motor.py" --arm "$arm" --seed "$seed" --gpu "$i" \
                  > "$DLS_DATA_ROOT/reports/d6/logs/train-$arm-seed$seed.log" 2>&1
              done
            ) &
            PIDS+=("$!")
          done
          failed=0
          for i in "${!PIDS[@]}"; do
            seed="${SEEDS[$i]}"
            if wait "${PIDS[$i]}"; then
              echo "PASS D6 both arms seed$seed"
              tail -1 "$DLS_DATA_ROOT/reports/d6/logs/train-local-seed$seed.log"
              tail -1 "$DLS_DATA_ROOT/reports/d6/logs/train-cross-seed$seed.log"
            else
              echo "FAIL D6 seed$seed"
              for arm in local cross; do
                file="$DLS_DATA_ROOT/reports/d6/logs/train-$arm-seed$seed.log"
                if test -e "$file"; then tail -90 "$file"; fi
              done
              failed=1
            fi
          done
          test "$failed" = 0

      - name: Run 648 completely new paired MetaDrive episodes across 27 CPU workers
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a NAMES=()
          for seed in 42 43 44; do
            for density in 0.00 0.10 0.25; do
              for shard in 0 1 2; do
                name="seed$seed-density$density-shard$shard"
                "$DLS_ENV/bin/python" "$TMPDIR/d6_eval_local_motor.py" \
                  --seed "$seed" --density "$density" --shard "$shard" \
                  > "$DLS_DATA_ROOT/reports/d6/logs/eval-$name.log" 2>&1 &
                PIDS+=("$!")
                NAMES+=("$name")
              done
            done
          done
          test "${#PIDS[@]}" -eq 27
          failed=0
          for i in "${!PIDS[@]}"; do
            if wait "${PIDS[$i]}"; then
              echo "PASS D6 ${NAMES[$i]}"
              tail -1 "$DLS_DATA_ROOT/reports/d6/logs/eval-${NAMES[$i]}.log"
            else
              echo "FAIL D6 ${NAMES[$i]}"
              tail -90 "$DLS_DATA_ROOT/reports/d6/logs/eval-${NAMES[$i]}.log"
              failed=1
            fi
          done
          test "$failed" = 0

      - name: Audit original weights unchanged and aggregate cross-message necessity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$DLS_DATA_ROOT/checkpoints/d1-v1/"C-seed{42,43,44}.pt > "$DLS_DATA_ROOT/reports/d6/original-C-sha256-after.txt"
          cmp "$DLS_DATA_ROOT/reports/d6/original-C-sha256-before.txt" "$DLS_DATA_ROOT/reports/d6/original-C-sha256-after.txt"
          sha256sum "$DLS_DATA_ROOT/checkpoints/d5a/"{clean,robust}-seed{42,43,44}.pt > "$DLS_DATA_ROOT/reports/d6/original-D5a-sha256-after.txt"
          cmp "$DLS_DATA_ROOT/reports/d6/original-D5a-sha256-before.txt" "$DLS_DATA_ROOT/reports/d6/original-D5a-sha256-after.txt"
          "$DLS_ENV/bin/python" "$TMPDIR/d6_aggregate.py"
          {
            printf '%s\n' "## D6: local information bottleneck cross vs self feedback"
            printf '%s\n' "- Two equal-parameter models 114880, each 3 training seeds, reused D1 BC data"
            printf '%s\n' "- 259 input -> fixed isometric 264 -> eight local 33-feature groups"
            printf '%s\n' "- Local/self vs cross/peer trained arms and frozen cross peer message blocking"
            printf '%s\n' "- 648 new paired episodes, 24 novel scene IDs x 3 densities x 3 seeds x 3 modes"
            printf '%s\n' "- Original D1 C and D5a weights unchanged"
            printf '%s\n' "- Report /mnt/datasets/lxb/dls/reports/d6/d6-summary.json"
          } >> "$GITHUB_STEP_SUMMARY"
