name: DLS D6b local sensory information and masked motor-output takeover

on:
  push:
    paths:
      - .github/workflows/d6b-local-info-motor-takeover.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d6b-local-info-motor-takeover
  cancel-in-progress: false

jobs:
  learn-and-validate-takeover:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      DLS_D6B_TRAINING: "1"
    steps:
      - name: Verify original trained data and D6 science result are ready, prevent accidental overwrite
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test -s "$DLS_DATA_ROOT/reports/d6/d6-summary.json"
          test -s "$DLS_DATA_ROOT/demonstrations/d1-v1/train/worker-00-density-0.00.npz"
          "$DLS_ENV/bin/python" -c "import torch; assert torch.cuda.device_count() >= 3"
          mkdir -p "$TMPDIR" "$DLS_DATA_ROOT/reports/d6b/logs"
          for seed in 42 43 44; do
            for arm in local cross; do
              test -s "$DLS_DATA_ROOT/checkpoints/d6/$arm-seed$seed.pt"
              test ! -e "$DLS_DATA_ROOT/checkpoints/d6b/$arm-seed$seed.pt"
              test ! -e "$DLS_DATA_ROOT/reports/d6b/train-$arm-seed$seed.json"
            done
          done
          test ! -e "$DLS_DATA_ROOT/reports/d6b/d6b-summary.json"
          test ! -e "$DLS_DATA_ROOT/reports/d6b/eval/seed42-density0.00-shard0.json"
          sha256sum "$DLS_DATA_ROOT/checkpoints/d6/"{local,cross}-seed{42,43,44}.pt > "$DLS_DATA_ROOT/reports/d6b/original-D6-sha256-before.txt"
          sha256sum "$DLS_DATA_ROOT/checkpoints/d5a/"{clean,robust}-seed{42,43,44}.pt > "$DLS_DATA_ROOT/reports/d6b/original-D5a-sha256-before.txt"
          df -h "$DLS_DATA_ROOT"

      - name: Reuse D1 sequence loader D5a damage sampler and D6 local motor architecture
        shell: bash
        run: |
          set -euo pipefail
          for item in "src/dls_p0.py:dls_p0.py" \
                      "src/dls_motor_redundancy.py:dls_motor_redundancy.py" \
                      "src/dls_local_motor.py:dls_local_motor.py" \
                      "scripts/d1_bc.py:d1_bc.py" \
                      "scripts/d5a_train_redundant_motor.py:d5a_train_redundant_motor.py" \
                      "scripts/d6b_train_motor_takeover.py:d6b_train_motor_takeover.py" \
                      "scripts/d6b_eval_motor_takeover.py:d6b_eval_motor_takeover.py" \
                      "scripts/d6b_aggregate.py:d6b_aggregate.py"; do
            SRC="${item%%:*}"
            NAME="${item#*:}"
            RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$SRC"
            OK=0
            for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
              if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/$NAME"; then
                OK=1
                break
              fi
            done
            test "$OK" = 1
            "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/$NAME"
          done
          "$DLS_ENV/bin/python" - <<'PY'
          import os,sys,torch
          sys.path.insert(0,os.environ["TMPDIR"])
          from dls_local_motor import LocalMotorController, num_params, run_sequence
          from d5a_train_redundant_motor import sample_unit_masks
          torch.set_num_threads(2)
          torch.manual_seed(42)
          L=LocalMotorController("local")
          torch.manual_seed(42)
          X=LocalMotorController("cross")
          assert num_params(L)==num_params(X)==114880
          assert all(torch.equal(a,b) for a,b in zip(L.parameters(),X.parameters()))
          assert torch.equal(L.projection,X.projection)
          x=torch.randn(3,4,259)
          mask=sample_unit_masks(3,torch.device("cpu"))
          assert mask.shape==(3,8)
          assert ((mask.sum(dim=1)>=6)&(mask.sum(dim=1)<=8)).all()
          healthy=run_sequence(X,x)
          assert healthy.shape==(3,4,2)
          torch.testing.assert_close(healthy,run_sequence(X,x,unit_mask=torch.ones(3,8)),rtol=0,atol=0)
          single=torch.ones(3,8);single[:,0]=0
          lesion=run_sequence(X,x,unit_mask=single)
          assert lesion.shape==healthy.shape and not torch.allclose(healthy,lesion)
          blocked=run_sequence(X,x,unit_mask=single,block_messages=True)
          assert blocked.shape==healthy.shape and not torch.allclose(lesion,blocked)
          lesion.sum().backward()
          assert torch.isfinite(X.value_weights.grad).all()
          print("D6b preflight PASS: same input/info local/cross, output-only mask, peer relay remains possible",flush=True)
          PY
          sha256sum "$TMPDIR/dls_local_motor.py" "$TMPDIR/d6b_train_motor_takeover.py" "$TMPDIR/d6b_eval_motor_takeover.py"

      - name: Train both equal-budget damage-robust local and cross models on three GPUs
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a SEEDS=(42 43 44)
          for i in "${!SEEDS[@]}"; do
            seed="${SEEDS[$i]}"
            (
              for arm in local cross; do
                "$DLS_ENV/bin/python" "$TMPDIR/d6b_train_motor_takeover.py" \
                  --arm "$arm" --seed "$seed" --gpu "$i" \
                  > "$DLS_DATA_ROOT/reports/d6b/logs/train-$arm-seed$seed.log" 2>&1
              done
            ) &
            PIDS+=("$!")
          done
          failed=0
          for i in "${!PIDS[@]}"; do
            seed="${SEEDS[$i]}"
            if wait "${PIDS[$i]}"; then
              echo "PASS D6b local and cross seed$seed"
              tail -1 "$DLS_DATA_ROOT/reports/d6b/logs/train-local-seed$seed.log"
              tail -1 "$DLS_DATA_ROOT/reports/d6b/logs/train-cross-seed$seed.log"
            else
              echo "FAIL D6b train seed$seed"
              for arm in local cross; do
                file="$DLS_DATA_ROOT/reports/d6b/logs/train-$arm-seed$seed.log"
                if test -e "$file"; then tail -100 "$file"; fi
              done
              failed=1
            fi
          done
          test "$failed" = 0

      - name: Evaluate 5832 paired healthy and output-lesioned episodes on 54 CPU workers
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a NAMES=()
          for seed in 42 43 44; do
            for density in 0.00 0.10 0.25; do
              for shard in 0 1 2 3 4 5; do
                name="seed$seed-density$density-shard$shard"
                "$DLS_ENV/bin/python" "$TMPDIR/d6b_eval_motor_takeover.py" \
                  --seed "$seed" --density "$density" --shard "$shard" \
                  > "$DLS_DATA_ROOT/reports/d6b/logs/eval-$name.log" 2>&1 &
                PIDS+=("$!")
                NAMES+=("$name")
              done
            done
          done
          test "${#PIDS[@]}" -eq 54
          failed=0
          for i in "${!PIDS[@]}"; do
            if wait "${PIDS[$i]}"; then
              echo "PASS D6b ${NAMES[$i]}"
              tail -1 "$DLS_DATA_ROOT/reports/d6b/logs/eval-${NAMES[$i]}.log"
            else
              echo "FAIL D6b ${NAMES[$i]}"
              tail -100 "$DLS_DATA_ROOT/reports/d6b/logs/eval-${NAMES[$i]}.log"
              failed=1
            fi
          done
          test "$failed" = 0

      - name: Prove old model weights unchanged and aggregate seed-level interaction effects
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$DLS_DATA_ROOT/checkpoints/d6/"{local,cross}-seed{42,43,44}.pt > "$DLS_DATA_ROOT/reports/d6b/original-D6-sha256-after.txt"
          cmp "$DLS_DATA_ROOT/reports/d6b/original-D6-sha256-before.txt" "$DLS_DATA_ROOT/reports/d6b/original-D6-sha256-after.txt"
          sha256sum "$DLS_DATA_ROOT/checkpoints/d5a/"{clean,robust}-seed{42,43,44}.pt > "$DLS_DATA_ROOT/reports/d6b/original-D5a-sha256-after.txt"
          cmp "$DLS_DATA_ROOT/reports/d6b/original-D5a-sha256-before.txt" "$DLS_DATA_ROOT/reports/d6b/original-D5a-sha256-after.txt"
          "$DLS_ENV/bin/python" "$TMPDIR/d6b_aggregate.py"
          {
            printf '%s\n' "## D6b: local-info motor-output-lesion takeover"
            printf '%s\n' "- Local vs cross message models identical train budget and output lesion masking"
            printf '%s\n' "- All original D1/D5a/D6 checkpoint weights unchanged"
            printf '%s\n' "- 3 seeds x 24 new scenes x 3 densities x 9 lesion conditions x 3 variants = 5832 episodes"
            printf '%s\n' "- Primary science test: cross vs local relative damage and frozen cross message-block necessity"
            printf '%s\n' "- Summary /mnt/datasets/lxb/dls/reports/d6b/d6b-summary.json"
          } >> "$GITHUB_STEP_SUMMARY"
