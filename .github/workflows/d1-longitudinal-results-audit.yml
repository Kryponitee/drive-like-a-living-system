name: DLS D1-prime read-only BC result audit

on:
  push:
    paths:
      - .github/workflows/d1-longitudinal-results-audit.yml
      - scripts/d1_longitudinal_results_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_DATA_ID: d1-longitudinal-v1-44117653285
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Verify completed training artifacts are present and immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test -x "$DLS_ENV/bin/python"
          test -d "$DLS_DATA_ROOT/checkpoints/$DLS_DATA_ID"
          test ! -e "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d1-bc-audit.json"
          for variant in A B C; do
            for seed in 42 43 44; do
              test -s "$DLS_DATA_ROOT/checkpoints/$DLS_DATA_ID/$variant-seed$seed.pt"
              test -s "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/train-$variant-seed$seed.json"
            done
          done

      - name: Download and run read-only audit
        shell: bash
        run: |
          set -euo pipefail
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/d1_longitudinal_results_audit.py"
          OK=0
          for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
            if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/d1_longitudinal_results_audit.py"; then
              OK=1
              break
            fi
          done
          test "$OK" = 1
          "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/d1_longitudinal_results_audit.py"
          "$DLS_ENV/bin/python" "$TMPDIR/d1_longitudinal_results_audit.py" | tee "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d1-bc-audit-console.log"
          test -s "$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d1-bc-audit.json"
          {
            printf '%s\n' "## DLS D1-prime BC read-only audit"
            printf '%s\n' "- 9 existing checkpoints audited; no training rerun"
            printf '%s\n' "- Summary: `$DLS_DATA_ROOT/reports/$DLS_DATA_ID/d1-bc-audit.json`"
          } >> "$GITHUB_STEP_SUMMARY"
