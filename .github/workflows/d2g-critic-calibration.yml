name: DLS D2g read-only frozen PPO critic calibration

on:
  push:
    paths:
      - .github/workflows/d2g-critic-calibration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dls-d2g-critic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 25
    env:
      DLS_DATA_ROOT: /mnt/datasets/lxb/dls
      DLS_ENV: /home/ps/miniconda3/envs/dls-p0
      TMPDIR: /mnt/datasets/lxb/dls/tmp
      XDG_CACHE_HOME: /mnt/datasets/lxb/dls/cache/xdg
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - name: Confirm earlier D2d D2f results, checkpoints and data disk
        shell: bash
        run: |
          set -euo pipefail
          test "$(findmnt -n -o TARGET -T "$DLS_DATA_ROOT")" = "/mnt/datasets"
          test -f "$DLS_DATA_ROOT/reports/d2f/d2f-summary.json"
          test -f "$DLS_DATA_ROOT/reports/d2d/d2d-summary.json"
          for phase in d2d d2f; do
            for v in A B C; do
              test -f "$DLS_DATA_ROOT/checkpoints/$phase-v1/$v-seed42.pt"
            done
          done
          mkdir -p "$TMPDIR" "$DLS_DATA_ROOT/reports/d2g/logs"
          test ! -e "$DLS_DATA_ROOT/reports/d2g/d2g-summary.json"
          test "$(df -Pk "$DLS_DATA_ROOT" | awk 'NR==2 {print $4}')" -gt 10485760

      - name: Fetch existing architecture and probability layer, plus new read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          for item in "src/dls_p0.py:dls_p0.py" \
                      "src/dls_recurrent_ppo.py:dls_recurrent_ppo.py" \
                      "scripts/d2g_critic_calibration.py:d2g.py"; do
            SOURCE="${item%%:*}"
            TARGET="${item#*:}"
            RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/$SOURCE"
            OK=0
            for URL in "https://gh-proxy.com/$RAW" "https://ghproxy.net/$RAW" "$RAW"; do
              if curl -fLsS --connect-timeout 10 --max-time 60 "$URL" -o "$TMPDIR/$TARGET"; then
                OK=1
                break
              fi
            done
            test "$OK" = 1
            "$DLS_ENV/bin/python" -m py_compile "$TMPDIR/$TARGET"
            sha256sum "$TMPDIR/$TARGET"
          done

      - name: Run six frozen actor-and-critic diagnostics in parallel on 24 new traffic scenarios
        shell: bash
        run: |
          set -euo pipefail
          declare -a PIDS=()
          declare -a NAMES=()
          for phase in d2d d2f; do
            for variant in A B C; do
              name="$phase-$variant"
              "$DLS_ENV/bin/python" "$TMPDIR/d2g.py" \
                --phase "$phase" --variant "$variant" \
                > "$DLS_DATA_ROOT/reports/d2g/logs/$name.log" 2>&1 &
              PIDS+=("$!")
              NAMES+=("$name")
            done
          done
          test "${#PIDS[@]}" -eq 6
          failed=0
          for i in "${!PIDS[@]}"; do
            if wait "${PIDS[$i]}"; then
              echo "PASS ${NAMES[$i]}"
              tail -1 "$DLS_DATA_ROOT/reports/d2g/logs/${NAMES[$i]}.log"
            else
              echo "FAIL ${NAMES[$i]}"
              tail -75 "$DLS_DATA_ROOT/reports/d2g/logs/${NAMES[$i]}.log"
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Aggregate critic calibration without false independent-step inference
        shell: bash
        run: |
          set -euo pipefail
          "$DLS_ENV/bin/python" - <<'PY'
          import json
          from pathlib import Path
          root=Path("/mnt/datasets/lxb/dls/reports/d2g")
          results={"stage":"D2g read-only critic calibration, no training",
                   "train_model_seed":42,"new_scenarios":list(range(4500,4524)),
                   "traffic_density":0.1,"gamma":0.99,"models":{}}
          for v in "ABC":
              runs={}
              for phase in ("d2d","d2f"):
                  r=json.loads((root/f"critic-{phase}-{v}-seed42.json").read_text())
                  assert r["scenarios"]==list(range(4500,4524))
                  assert r["no_training"] and r["steps"]>0
                  assert len(r["episodes"])==24
                  runs[phase]={
                      "successes":r["successes"],
                      "total_transitions":r["steps"],
                      "critic_explained_variance":r["critic_explained_variance_over_transitions"],
                      "critic_value_return_pearson":r["critic_value_return_pearson_over_transitions"],
                      "critic_value_return_MAE":r["critic_value_return_MAE"],
                      "td_abs":r["mean_absolute_one_step_TD_residual"],
                      "value_std":r["critic_value_std"],
                      "realized_return_std":r["realized_return_std"],
                      "initial_state_value_return_pearson":r["first_state_value_return_pearson_over_episodes"],
                      "timeouts_bootstrapped":r["time_limit_bootstrap_count"],
                  }
              results["models"][v]=runs
              print(v,[(p,round(row["critic_explained_variance"],4),
                             round(row["critic_value_return_MAE"],2),
                             row["critic_value_return_pearson"])
                       for p,row in runs.items()])
          out=root/"d2g-summary.json"
          assert not out.exists()
          out.write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding="utf-8")
          print("Saved:",out)
          PY
          {
            echo "## D2g read-only critic value diagnostic"
            echo "- Six frozen actor/critic pairs, 24 unseen scenes, no PPO updates"
            echo "- Measure V(s) versus discounted realized return, paired stochastic noise"
            echo "- Preserve all BC and PPO weights; save only analysis reports to data disk"
            echo "- Summary: \`$DLS_DATA_ROOT/reports/d2g/d2g-summary.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
